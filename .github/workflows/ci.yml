          pathlib.Path(sys.argv[2]).write_bytes(raw)
          PY
          if (cd "${negative:?}" && CCI_BOARD_REKEY_CONTRACT=1 go test -count=1 -run '^TestBoardOriginalRekeyNecessarySuperset$' -v ./internal/store) > "$RUNNER_TEMP/board-row-negative.log" 2>&1; then
            echo 'immutable board row-rekey control unexpectedly passed' >&2
            exit 1
          fi
          grep -q 'BOARD_ORIGINAL_REKEY_SUPERSET_MISSING' "$RUNNER_TEMP/board-row-negative.log"
      - name: Board original rekey, old-writer and native watch contracts
        env:
          GOMAXPROCS: '2'
        run: |
          set -euo pipefail
          CCI_BOARD_REKEY_CONTRACT=1 CCI_BOARD_WRITER_WATCH_CONTRACT=1 go test -count=1 -run '^TestBoard(OriginalRekeyNecessarySuperset|OldWriterMovesDeletesAndCurrentBodyRetention|BodyMovesDeletesNeverRetainStaleBytes|AtomicRenameRejectsMixedCutThenRebinds|MissingPathCreationIsFreshOrVisibleIncomplete|LostRegistrationNeverReturnsSuccess|NativeRegistrationFailureIsVisible|LinuxOverflowWireNeverReturnsSuccess|DarwinMissingParentRefusesBeforeFanout)$' -v ./internal/store | tee "$RUNNER_TEMP/board-writer-watch.log"
          python3 - "$RUNNER_TEMP/board-writer-watch.log" <<'PY'
          import pathlib, re, sys
          raw = pathlib.Path(sys.argv[1]).read_text()
          assert not re.search(r"^--- (?:FAIL|SKIP):", raw, re.M)
          assert len(re.findall(r"^--- PASS: TestBoard", raw, re.M)) == 8
          assert len(re.findall(r"BOARD_ORIGINAL_REKEY_PARITY case=", raw)) == 4
          PY
      - name: Board full-population native SQL work and cold backfill
        env:
          GOMAXPROCS: '2'
        run: |
          set -euo pipefail
          CCI_BOARD_FULL_SQL_WORK=1 go test -count=1 -run '^TestBoard(FullPopulation|ColdBackfill)SQLPredicateWork$' -v ./internal/store | tee "$RUNNER_TEMP/board-full-sql-work.log"
          python3 - "$RUNNER_TEMP/board-full-sql-work.log" <<'PY'
          import pathlib, re, sys
          raw = pathlib.Path(sys.argv[1]).read_text()
          assert not re.search(r"^--- (?:FAIL|SKIP):", raw, re.M)
          assert len(re.findall(r"^--- PASS: TestBoard(?:FullPopulation|ColdBackfill)SQLPredicateWork ", raw, re.M)) == 2
          for label in ("BOARD_FULL_POPULATION_SQL_WORK", "BOARD_COLD_BACKFILL_SQL_WORK"):
              values = re.findall(label + r" population=(32|10000|100000) record_predicate_evaluations=(\d+)", raw)
              assert len(values) == 3 and {int(n) for n, count in values} == {32, 10000, 100000}
              assert all(int(count) > 0 for n, count in values)
          PY
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Actual LR retained845 and candidate helper parity
        run: |
          set -euo pipefail
          base="$HOME/.vcache/scratch/cci-board-lr-parity"
