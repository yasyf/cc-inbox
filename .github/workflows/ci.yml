name: CI

on:
  schedule:
    - cron: "27 4 * * *"
  workflow_call:
    inputs:
      commit:
        description: Exact commit to validate
        required: true
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Exact commit to validate
        required: true
        type: string

concurrency:
  group: ci-${{ inputs.commit || github.ref }}
  cancel-in-progress: ${{ inputs.commit == '' && github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate native workflow contracts
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color
          python3 .github/scripts/test-native-release-gates.py
          go build -o "$RUNNER_TEMP/release-version" ./scripts/release-version
          RELEASE_VERSION_COMPARE="$RUNNER_TEMP/release-version" python3 .github/scripts/test-release-main-sync.py

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 165
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'schedule' && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    env:
      FULL_CI: ${{ matrix.os == 'ubuntu-latest' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
      RACE_STEP_TESTS: '^TestAddressedDoneBodyTransferDiagnostic$|^TestHookOwedDoesNotDecodeUnrelatedCloserHistory$'
      TAIL_COST_TESTS: '^TestTailRecipientHistoryBaseline$|^TestTailResolverHistoryBaseline$|^TestTailPreservesRequested80000JSONRecords$|^TestTailNewestLimitDoesNotWalkSameDriveHistory$|^TestTailPeerFanInKeepsNewestLookupBounded$'
      WORK_COUNT_TESTS: '^TestAudienceActualCLIQueryWorkDiagnostic$|^TestGrepSelectedRepliesDoNotReadUnrelatedRecords$|^TestGrepReadsHistoryOnceForAnnotations$|^TestNativeTailBorrowedStoreOperationCounts$|^TestGrepTextBodyProjectionWork$|^TestDaemonLaneHistoryDoesNotScaleWithOldRows$|^TestTailTextBodyTransferDiagnostic$|^TestAudienceQueryPlanDiagnostic$|^TestAudienceKindQueryAndCountWork$|^TestSelectedClosureKeyComparisonsStayBounded$|^TestRegisteredLaneComparisonsStayBounded$|^TestSelectedRecordsPKWorkStaysBounded$|^TestSettleStoresAPageOfHeldRowsPerTransaction$|^TestApplyWritesEveryBodyBeforeItTakesTheWriteLock$|^TestIngestAllStoresAPageOfLinesPerTransaction$|^TestReparseStoresAPageOfLinesPerTransaction$|^TestCompactFoldsAPageOfRecordsPerTransaction$|^TestABoardColdRebuildHoldsTheWriteLockAPageAtATime$|^TestAnIncidentScopesFirstPublishHoldsTheWriteLockAPageAtATime$'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/checkout@v7
        if: env.FULL_CI == 'true'
        with:
          ref: fe73b8c28964aa004782c8f0c7dd1fcca2ee082b
          path: .ci-tail-page-baseline
          persist-credentials: false
      - uses: actions/checkout@v7
        if: env.FULL_CI == 'true'
        with:
          ref: 69637a6ba3370ec3a3ba11a59bb6b1d80d367dbb
          path: .ci-render-text-baseline
          persist-credentials: false
      - uses: actions/checkout@v7
        if: env.FULL_CI == 'true'
        with:
          ref: cc7485ab2ca7cda03f7790b38bdb0312b26fbcae
          path: .ci-audience-current491
          persist-credentials: false
      - uses: actions/checkout@v7
        if: env.FULL_CI == 'true'
        with:
          ref: 80a23237731d154e73b2ab9c908809316407ea80
          path: .ci-urgent-repeat-baseline
          persist-credentials: false
      - uses: actions/checkout@v7
        if: env.FULL_CI == 'true'
        with:
          ref: ab018eb917f569717b4c67a3cd14cb9be660b41c
          path: .ci-urgent-repeat-old
          persist-credentials: false
      - uses: actions/checkout@v7
        if: env.FULL_CI == 'true'
        with:
          ref: 696cde4efcdb47697901bebb2d6b1aa12a3496c9
          path: .ci-channel-watch-baseline
          persist-credentials: false
      - uses: actions/checkout@v7
        if: env.FULL_CI == 'true'
        with:
          ref: 4e6e169dee4f18963df7fd3e00f4d5b89ee40891
          path: .ci-stream-idle-baseline
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 0b83dbc7fc55f29e552ecafb6cd2a6206d1f57b2
          path: .ci-old
      - uses: actions/checkout@v7
        if: env.FULL_CI == 'true'
        with:
          ref: 722f03bcbaadf335f6ee9cb7d2c4b57e274f942e
          path: .ci-recipients-baseline
      - uses: actions/checkout@v7
        if: env.FULL_CI == 'true'
        with:
          ref: e08497bf9ce5880788f6103a949e034c9ed13fc4
          path: .ci-grep-baseline
      - uses: actions/checkout@v7
        if: env.FULL_CI == 'true'
        with:
          ref: c148e0dc6970d4d5f446d77ba62d8a4060e0156c
          path: .ci-tail-baseline
      - uses: actions/checkout@v7
        if: env.FULL_CI == 'true'
        with:
          ref: 7f5c374e7cd07911aa432b3434036a27b9007de9
          path: .ci-native-tail-baseline
      - uses: actions/checkout@v7
        if: env.FULL_CI == 'true'
        with:
          ref: e101a16aa7d3d3023e6a0e8cd5fecca718e2c243
          path: .ci-native-tail-null-baseline
      - uses: actions/checkout@v7
        if: env.FULL_CI == 'true'
        with:
          ref: a578e6f0ffcf53b3f888ba7b262d740ac5c6cd64
          path: .ci-lane-score-baseline
      - uses: actions/checkout@v7
        if: env.FULL_CI == 'true'
        with:
          ref: b7da336975a6651226912c5c129a38bec9c0e3da
          path: .ci-incident-negative
      - uses: actions/checkout@v7
        if: env.FULL_CI == 'true'
        with:
          ref: e65cf4da214ea889e729c7cfdae79a8eb4f6cec0
          path: .ci-incident-registration-negative
      - uses: actions/checkout@v7
        if: env.FULL_CI == 'true'
        with:
          ref: 23dcba01c1512bf876f6caf6e431cdc0f3731ec7
          path: .ci-incident-registration-window-negative
      - uses: actions/checkout@v7
        if: env.FULL_CI == 'true'
        with:
          ref: e9610dc3fc29a2d3aa8fb342363adacf130c4ed5
          path: .ci-incident-shared-node-negative
      - uses: actions/checkout@v7
        if: env.FULL_CI == 'true'
        with:
          ref: 87dab0b9b17cd755721a4c0d74ec9488618c2ae9
          path: .ci-grep-selected-baseline
      - uses: actions/checkout@v7
        if: env.FULL_CI == 'true'
        with:
          ref: 5e61c5bc11d417c601889cac1393b346d17a44cb
          path: .ci-mesh-export-baseline
      - uses: actions/checkout@v7
        if: env.FULL_CI == 'true'
        with:
          ref: a578e6f0ffcf53b3f888ba7b262d740ac5c6cd64
          path: .ci-openamong-oracle
      - uses: actions/checkout@v7
        if: env.FULL_CI == 'true'
        with:
          ref: 53c067b27a53ac3798753309221a6b4f4190e5b7
          path: .ci-openamong-negative
      - uses: actions/checkout@v7
        if: env.FULL_CI == 'true'
        with:
          ref: 838d6a6ad8ec051bd9ec09070785d3b838f8398a
          path: .ci-hook-owed-baseline
      - uses: actions/checkout@v7
        if: env.FULL_CI == 'true'
        with:
          ref: 67a9ba0415a718dd7ed61773695da93a8061e7ef
          path: .ci-selected-seqs-baseline
          persist-credentials: false
      - uses: actions/checkout@v7
        if: env.FULL_CI == 'true'
        with:
          ref: fbc0e5bd6479118800bf57b118ae6dfeaf6bbee3
          path: .ci-compact-line-baseline
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Urgent repeat existing-query index diagnostic
        if: env.FULL_CI == 'true'
        run: |
          cp internal/store/testdata/urgent-repeat-old/compat_test.go .ci-urgent-repeat-old/internal/store/urgent_repeat_legacy_internal_test.go
          test "$(git -C .ci-urgent-repeat-old rev-parse HEAD)" = ab018eb917f569717b4c67a3cd14cb9be660b41c
          (cd .ci-urgent-repeat-old && go test -count=1 -race -run '^TestUrgentRepeatLegacyQueryCompatibility$' -v ./internal/store)
          cp internal/store/urgent_repeat_cost_internal_test.go .ci-urgent-repeat-baseline/internal/store/
          cp internal/store/index_cost_internal_test.go .ci-urgent-repeat-baseline/internal/store/
          cp internal/store/testdata/urgent-repeat-baseline/use_handle_test.go .ci-urgent-repeat-baseline/internal/store/use_handle_internal_test.go
          test "$(git -C .ci-urgent-repeat-baseline rev-parse HEAD)" = 80a23237731d154e73b2ab9c908809316407ea80
          if (cd .ci-urgent-repeat-baseline && CCI_URGENT_REPEAT_REQUIRE_STOCK_BOUND=1 go test -count=1 -run '^TestUrgentRepeatIndexDiagnostic$' -v ./internal/store) > "$RUNNER_TEMP/urgent-repeat-old.log" 2>&1; then
            cat "$RUNNER_TEMP/urgent-repeat-old.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/urgent-repeat-old.log"
          for history in 32 10000; do
            grep -F "URGENT_REPEAT_BOUND_EXCEEDED history=$history index=stock " "$RUNNER_TEMP/urgent-repeat-old.log"
          done
          go test -count=1 -race -run '^TestUrgentRepeatIndex' -v ./internal/store
          CCI_URGENT_INDEX_ROWS=250000 go test -count=1 -run '^TestUrgentRepeatIndexProvisioningWithinWriterBudget$' -v ./internal/store
      - name: Audience kind candidates and immutable491 work control
        if: env.FULL_CI == 'true'
        run: |
          cp internal/cli/audience_query_cost_test.go .ci-audience-current491/internal/cli/
          cp internal/store/audience_plan_internal_test.go .ci-audience-current491/internal/store/
          test "$(git -C .ci-audience-current491 rev-parse HEAD)" = cc7485ab2ca7cda03f7790b38bdb0312b26fbcae
          if (cd .ci-audience-current491 && CCI_AUDIENCE_REQUIRE_BOUNDED_KIND=1 go test -count=1 -run '^TestAudience' -v ./internal/cli ./internal/store) > "$RUNNER_TEMP/audience491-old.log" 2>&1; then
            cat "$RUNNER_TEMP/audience491-old.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/audience491-old.log"
          for verb in tail grep; do
            for history in 32 10000; do
              grep -F "AUDIENCE_KIND_BOUND_EXCEEDED verb=$verb history=$history " "$RUNNER_TEMP/audience491-old.log"
            done
          done
          for operation in query count; do
            for history in 32 10000; do
              grep -F "AUDIENCE_STORE_BOUND_EXCEEDED operation=$operation history=$history unique_kinds=1 " "$RUNNER_TEMP/audience491-old.log"
            done
          done
          CCI_AUDIENCE_REQUIRE_BOUNDED_KIND=1 go test -count=1 -race -run '^TestAudience' -v ./internal/cli ./internal/store
      - name: Text Grep body projection, immutable work control, and public parity
        if: env.FULL_CI == 'true'
        run: |
          test "$(git -C .ci-audience-current491 rev-parse HEAD)" = cc7485ab2ca7cda03f7790b38bdb0312b26fbcae
          cp internal/cli/grep_body_projection_test.go .ci-audience-current491/internal/cli/
          if (cd .ci-audience-current491 && go test -count=1 -run '^TestGrepTextBodyProjectionWork$' -v ./internal/cli) > "$RUNNER_TEMP/grep-body-old.log" 2>&1; then
            cat "$RUNNER_TEMP/grep-body-old.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/grep-body-old.log"
          for history in 32 10000; do
            grep -F "GREP_BODY_TRANSFER_BOUND_EXCEEDED rows=$history json=false reads=$history want=0" "$RUNNER_TEMP/grep-body-old.log"
          done
          test "$(git -C .ci-compact-line-baseline rev-parse HEAD)" = fbc0e5bd6479118800bf57b118ae6dfeaf6bbee3
          (cd .ci-audience-current491 && go build -p 2 -o "$RUNNER_TEMP/cci-grep-body-old" ./cmd/cci)
          (cd .ci-compact-line-baseline && go build -p 2 -o "$RUNNER_TEMP/cci-grep-body-parity" ./cmd/cci)
          go build -p 2 -o "$RUNNER_TEMP/cci-grep-body-current" ./cmd/cci
          CCI_GREP_BODY_OLD_CLI="$RUNNER_TEMP/cci-grep-body-old" CCI_GREP_BODY_PARITY_CLI="$RUNNER_TEMP/cci-grep-body-parity" CCI_GREP_BODY_CURRENT_CLI="$RUNNER_TEMP/cci-grep-body-current" go test -count=1 -race -run '^TestGrepTextBodyProjection' -v ./internal/cli
      - uses: actions/checkout@v7
        if: env.FULL_CI == 'true'
        with:
          ref: eefa897af4e7bfb33d319c2f8c8840b2f9eb22ce
          path: .ci-tail-body-baseline
      - name: Text Tail body projection and immutable work control
        if: env.FULL_CI == 'true'
        run: |
          test "$(git -C .ci-tail-body-baseline rev-parse HEAD)" = eefa897af4e7bfb33d319c2f8c8840b2f9eb22ce
          cp internal/cli/tail_body_diagnostic_test.go .ci-tail-body-baseline/internal/cli/
          if (cd .ci-tail-body-baseline && go test -count=1 -race -run '^TestTailTextBodyTransferDiagnostic$' -v ./internal/cli) > "$RUNNER_TEMP/tail-body-old.log" 2>&1; then
            cat "$RUNNER_TEMP/tail-body-old.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/tail-body-old.log"
          for rows in 32 10000; do
            grep -F "TAIL_BODY_TRANSFER_BOUND_EXCEEDED rows=$rows json=false reads=$rows want=0" "$RUNNER_TEMP/tail-body-old.log"
          done
          go test -count=1 -race -run '^TestTailTextBodyTransferDiagnostic$' -v ./internal/cli
      - name: Text Tail retained private fixture native query plans
        if: env.FULL_CI == 'true'
        run: go test -count=1 -run '^TestTailProjectionPrivateFixturePlan$' -v ./internal/store
      - uses: actions/checkout@v7
        if: env.FULL_CI == 'true'
        with:
          ref: 70ea38a2108e20eadf526838d9d97797c63cdcec
          path: .ci-cli-output-baseline
          persist-credentials: false
      - name: Text Tail Body immutable output error and cursor contract
        if: env.FULL_CI == 'true'
        run: |
          test "$(git -C .ci-cli-output-baseline rev-parse HEAD)" = 70ea38a2108e20eadf526838d9d97797c63cdcec
          cp internal/cli/tail_body_contract_test.go .ci-cli-output-baseline/internal/cli/
          mkdir -p "$RUNNER_TEMP/cci-tail-body-contract"
          (cd .ci-cli-output-baseline && CCI_TAIL_BODY_CONTRACT_SNAPSHOTS="$RUNNER_TEMP/cci-tail-body-contract" CCI_TAIL_BODY_CONTRACT_WRITE=1 go test -count=1 -run '^TestTailBodyContract' -v ./internal/cli)
          CCI_TAIL_BODY_CONTRACT_SNAPSHOTS="$RUNNER_TEMP/cci-tail-body-contract" go test -count=1 -run '^TestTailBodyContract' -v ./internal/cli
      - uses: actions/checkout@v7
        if: env.FULL_CI == 'true'
        with:
          ref: 4c0bb3dd0873b2e978c6d12933f3db7a8206fd72
          path: .ci-addressed-body-baseline
      - name: Shared addressed done Body transfer bound and immutable current route controls
        if: env.FULL_CI == 'true'
        run: |
          test "$(git -C .ci-addressed-body-baseline rev-parse HEAD)" = 4c0bb3dd0873b2e978c6d12933f3db7a8206fd72
          cp internal/inbox/addressed_body_diagnostic_test.go .ci-addressed-body-baseline/internal/inbox/
          if (cd .ci-addressed-body-baseline && go test -count=1 -run '^TestAddressedDoneBodyTransferDiagnostic$' -v ./internal/inbox) > "$RUNNER_TEMP/addressed-body-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/addressed-body-negative.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/addressed-body-negative.log"
          for rows in 32 10000; do
            for json in false true; do
              for mode in readerFor laneMailBacklog; do
                grep -F "ADDRESSED_DONE_BODY_BOUND_EXCEEDED rows=$rows json=$json mode=$mode reads=$((rows+1)) want=1" "$RUNNER_TEMP/addressed-body-negative.log"
              done
              grep -F "ADDRESSED_PAGE_DERIVED_BOUND rows=$rows json=$json additional_record_queries=0 additional_body_reads=0 additional_body_bytes=0" "$RUNNER_TEMP/addressed-body-negative.log"
            done
          done
          go test -count=1 -race -run '^TestAddressedDoneBodyTransferDiagnostic$' -v ./internal/inbox
      - name: Reader and mailbox addressed done Body immutable current contract
        if: env.FULL_CI == 'true'
        run: |
          test "$(git -C .ci-cli-output-baseline rev-parse HEAD)" = 70ea38a2108e20eadf526838d9d97797c63cdcec
          cp internal/cli/addressed_body_contract_test.go .ci-cli-output-baseline/internal/cli/
          mkdir -p "$RUNNER_TEMP/cci-addressed-body-contract"
          (cd .ci-cli-output-baseline && CCI_ADDRESSED_BODY_CONTRACT_SNAPSHOTS="$RUNNER_TEMP/cci-addressed-body-contract" CCI_TAIL_BODY_CONTRACT_WRITE=1 go test -count=1 -run '^TestAddressedDone(Body|ErrorAndBudget)Contract$' -v ./internal/cli)
          CCI_ADDRESSED_BODY_CONTRACT_SNAPSHOTS="$RUNNER_TEMP/cci-addressed-body-contract" go test -count=1 -run '^TestAddressedDone(Body|ErrorAndBudget)Contract$' -v ./internal/cli
      - name: Tail page assembly current-head parity and allocation scaling
        if: env.FULL_CI == 'true'
        run: |
          test "$(git -C .ci-tail-page-baseline rev-parse HEAD)" = fe73b8c28964aa004782c8f0c7dd1fcca2ee082b
          cp internal/inbox/tail_page_assembly_test.go .ci-tail-page-baseline/internal/inbox/
          test "$(git -C .ci-cli-output-baseline rev-parse HEAD)" = 70ea38a2108e20eadf526838d9d97797c63cdcec
          cp internal/cli/tail_page_assembly_contract_test.go .ci-cli-output-baseline/internal/cli/
          mkdir -p "$RUNNER_TEMP/cci-tail-page-contract"
          (cd .ci-cli-output-baseline && CCI_TAIL_PAGE_CONTRACT_SNAPSHOTS="$RUNNER_TEMP/cci-tail-page-contract" CCI_TAIL_BODY_CONTRACT_WRITE=1 go test -count=1 -run '^TestTailPageAssemblyContract$' -v ./internal/cli)
          CCI_TAIL_PAGE_CONTRACT_SNAPSHOTS="$RUNNER_TEMP/cci-tail-page-contract" go test -count=1 -run '^TestTailPageAssemblyContract$' -v ./internal/cli
          if (cd .ci-tail-page-baseline && CCI_TAIL_PAGE_ALLOCATION=1 go test -count=1 -run '^TestTailPageAssemblyAllocationScaling$' -v ./internal/inbox) > "$RUNNER_TEMP/tail-page-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/tail-page-negative.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/tail-page-negative.log"
          for rows in 10000 20000; do
            grep -F "TAIL_PAGE_ALLOCATION_BOUND_EXCEEDED rows=$rows " "$RUNNER_TEMP/tail-page-negative.log"
          done
          CCI_TAIL_PAGE_ALLOCATION=1 go test -count=1 -run '^TestTailPageAssemblyAllocationScaling$' -v ./internal/inbox
          (cd .ci-tail-page-baseline && go test -run '^$' -bench '^BenchmarkTailPageAssembly$' -benchmem -benchtime=1x ./internal/inbox)
          go test -run '^$' -bench '^BenchmarkTailPageAssembly$' -benchmem -benchtime=1x ./internal/inbox
      - name: Channel watch unchanged work and immutable 0.49.9 control
        if: env.FULL_CI == 'true'
        run: |
          test "$(git -C .ci-channel-watch-baseline rev-parse HEAD)" = 696cde4efcdb47697901bebb2d6b1aa12a3496c9
          cp internal/inbox/watch_work_test.go .ci-channel-watch-baseline/internal/inbox/
          if (cd .ci-channel-watch-baseline && go test -count=1 -run '^TestWatchUnchangedPollWork$' -v ./internal/inbox) > "$RUNNER_TEMP/channel-watch-old.log" 2>&1; then
            cat "$RUNNER_TEMP/channel-watch-old.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/channel-watch-old.log"
          for count in 32 10000; do
            for drive in d foreign; do
              grep -F "WATCH_POLL_WORK population=$count placement=$drive polls=3 record_queries=3 emitted=0" "$RUNNER_TEMP/channel-watch-old.log"
            done
          done
          go test -count=1 -race -run '^TestWatch' -v ./internal/inbox
      - name: SSE idle queries, immutable history control, and commit freshness
        if: env.FULL_CI == 'true'
        run: |
          test "$(git -C .ci-stream-idle-baseline rev-parse HEAD)" = 4e6e169dee4f18963df7fd3e00f4d5b89ee40891
          cp internal/server/stream_idle_cost_test.go .ci-stream-idle-baseline/internal/server/
          if (cd .ci-stream-idle-baseline && go test -count=1 -run '^TestStreamIdleQueriesDoNotRepeatUnmatchedHistory$' -v ./internal/server) > "$RUNNER_TEMP/stream-idle-old.log" 2>&1; then
            cat "$RUNNER_TEMP/stream-idle-old.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/stream-idle-old.log"
          grep -F 'for 32 unmatched rows, want at most' "$RUNNER_TEMP/stream-idle-old.log"
          grep -F 'for 10000 unmatched rows, want at most' "$RUNNER_TEMP/stream-idle-old.log"
          go test -count=1 -race -run '^TestChangeVersion' -v ./internal/store
          go test -count=1 -race -run '^TestStream' -v ./internal/server
      - name: Vet
        run: go vet ./...
      - name: Build immutable 0.41.1 store compatibility probe
        run: |
          cci_old_store_probe="$RUNNER_TEMP/cci-old-store-probe"
          test "$(git -C .ci-old rev-parse HEAD)" = 0b83dbc7fc55f29e552ecafb6cd2a6206d1f57b2
          mkdir -p .ci-old/cmd/compat-probe
          cp internal/store/testdata/compat-probe/main.go .ci-old/cmd/compat-probe/main.go
          cd .ci-old
          go build -p 2 -o "$cci_old_store_probe" ./cmd/compat-probe
          test -x "$cci_old_store_probe"
          printf 'CCI_OLD_STORE_PROBE=%s\n' "$cci_old_store_probe" >> "$GITHUB_ENV"
      - name: Cask handoff waits for committed installation
        if: env.FULL_CI == 'true'
        run: |
          test "$(git -C .ci-mesh-export-baseline rev-parse HEAD)" = 5e61c5bc11d417c601889cac1393b346d17a44cb
          cp internal/version/cask_readiness_test.go .ci-mesh-export-baseline/internal/version/
          if (cd .ci-mesh-export-baseline && go test -count=1 -run '^TestCaskHandoffWaitsForCommittedReceipt$' -v ./internal/version) > "$RUNNER_TEMP/cci-cask-readiness-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/cci-cask-readiness-negative.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/cci-cask-readiness-negative.log"
          grep -F 'staged cask selected before committed receipt' "$RUNNER_TEMP/cci-cask-readiness-negative.log"
          go test -count=1 -race -v ./internal/version
