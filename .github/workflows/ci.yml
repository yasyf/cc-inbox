          PYTHONPATH="${parity:?}/scripts" uv run --no-project --python 3.14 --with pytest==9.1.1 python -m pytest -q -p no:cacheprovider "${parity:?}/tests/test_board_rows.py" "${parity:?}/tests/test_board_provider.py" | tee "$RUNNER_TEMP/board-lr-helper-parity.log"
          if grep -Eq '[0-9]+ (failed|skipped|error)' "$RUNNER_TEMP/board-lr-helper-parity.log"; then
