          go test -count=3 -run '^TestRenderedTextWhitespace$' -bench '^BenchmarkRenderedText$/././Record$' -benchmem -benchtime=20000x -cpu=2 ./internal/render | tee "$RUNNER_TEMP/render-text-current.log"
          go test -count=3 -run '^TestRenderedTextWhitespace$' -bench '^BenchmarkRenderedText$/././Aggregate$' -benchmem -benchtime=100ms -cpu=2 ./internal/render | tee -a "$RUNNER_TEMP/render-text-current.log"
          python3 - "$RUNNER_TEMP/render-text-old.log" "$RUNNER_TEMP/render-text-current.log" <<'PY' | tee "$RUNNER_TEMP/render-text-summary.log"
          import json
          import re
          import statistics
          import sys
          from pathlib import Path

          def read(path):
              samples = {}
              for line in Path(path).read_text().splitlines():
                  fields = line.split()
                  if not fields or not fields[0].startswith("BenchmarkRenderedText/"):
                      continue
                  match = re.fullmatch(r"(BenchmarkRenderedText/(ASCII|ASCIIWhitespace|Unicode|Whitespace|Empty|SingleWord|LongWord)/N(32|10000)/(Record|Aggregate))-2", fields[0])
                  assert match, fields
                  if match[4] == "Record":
                      assert int(fields[1]) >= int(match[3]), ("incomplete measured working-set sweep", fields)
                  metrics = {key: float(fields[fields.index(key) - 1]) for key in ("ns/op", "B/op", "allocs/op")}
                  samples.setdefault(match[1], []).append(metrics)
              expected = {f"BenchmarkRenderedText/{kind}/N{n}/{mode}" for kind in ("ASCII", "ASCIIWhitespace", "Unicode", "Whitespace", "Empty", "SingleWord", "LongWord") for n in (32, 10000) for mode in ("Record", "Aggregate")}
              assert set(samples) == expected, samples
              assert all(len(rows) == 3 for rows in samples.values()), samples
              return {name: {key: statistics.median(row[key] for row in rows) for key in ("ns/op", "B/op", "allocs/op")} for name, rows in samples.items()}

          before, after = map(read, sys.argv[1:])
          aggregate = {name: {"time_ratio": after[name]["ns/op"] / before[name]["ns/op"], "byte_delta": after[name]["B/op"] - before[name]["B/op"], "allocation_delta": after[name]["allocs/op"] - before[name]["allocs/op"]} for name in before if name.endswith("/Aggregate")}
          print(json.dumps({"before": before, "after": after, "aggregate_diagnostics": aggregate, "allocation_units": "Record gates use integer bytes and allocations per rendered record; Aggregate retains measured bytes and allocations per full batch as a diagnostic", "timing": "Recorded steady-state samples; aggregate timing and affected-query CPU acceptance remain separate from per-record allocation gates"}, sort_keys=True), flush=True)
          for name in before:
              if name.endswith("/Aggregate"):
                  continue
              if any(f"/{kind}/" in name for kind in ("ASCIIWhitespace", "Whitespace", "Empty", "SingleWord", "LongWord")):
                  assert after[name]["B/op"] <= before[name]["B/op"], (name, before[name], after[name])
                  assert after[name]["allocs/op"] <= before[name]["allocs/op"], (name, before[name], after[name])
              else:
                  assert after[name]["B/op"] < before[name]["B/op"], (name, before[name], after[name])
                  assert after[name]["allocs/op"] < before[name]["allocs/op"], (name, before[name], after[name])
