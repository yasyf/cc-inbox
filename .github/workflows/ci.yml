              (cd "${worktree:?}" && CCI_BOARD_CLI_POPULATION="$population" CCI_BOARD_CLI_PHASE="$phase" go test -p 2 -count=1 -run '^TestBoardRealFreshCLIWarmChanged$' -v ./internal/cli) | tee "$RUNNER_TEMP/board-real-cli-$population-$phase.log"
            done
