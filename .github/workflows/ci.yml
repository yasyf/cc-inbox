name: Native Tail fixture phase diagnostic
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact reviewed diagnostic source
        required: true
        type: string
permissions:
  contents: read
jobs:
  fixture-phases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOMAXPROCS: "2"
      GOFLAGS: -p=2
      SOURCE_SHA: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Native HTTP fixture setup phase attribution
        run: CCI_NATIVE_TAIL_FIXTURE_TIMINGS=1 go test -count=1 -race -run '^TestNativeTailRejectsNullArgumentBeforeCore$' -v ./internal/cli
