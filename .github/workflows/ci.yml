          git worktree add --detach "${worktree:?}" HEAD
          python3 .github/scripts/prepare-board-work-source.py "${worktree:?}" internal/cli/testdata/board_ci_callsite_instrumentation.json
          cp internal/cli/board_real_fresh_cli_test.go.source "${worktree:?}/internal/cli/board_real_fresh_cli_test.go"
          (cd "${worktree:?}" && go build -p 2 -o "$RUNNER_TEMP/cci-board-work" ./cmd/cci)
      - name: Board32 real fresh CLI warm and changed work
        env:
