name: CI
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact immutable baseline plus counter fixture
        required: true
        type: string
permissions:
  contents: read
jobs:
  mesh-export-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Actual installed-source mesh export work at N32 and N10000
        run: go test -count=1 -run '^TestMeshExportHistoryBaseline$' -v ./internal/mesh
