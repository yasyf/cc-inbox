        run: |
          set -euo pipefail
          CCI_BOARD_ERROR_CONTRACT=1 go test -count=1 -run '^TestBoardOriginalRuling(ErrorBytes|DriveOrder)$' -v ./internal/cli | tee "$RUNNER_TEMP/board-original-errors.log"
          CCI_BOARD_SQL_WORK=1 go test -count=1 -run '^TestBoardSameKindSQLPredicateWork$' -v ./internal/store | tee "$RUNNER_TEMP/board-sql-work.log"
          python3 - "$RUNNER_TEMP/board-original-errors.log" "$RUNNER_TEMP/board-sql-work.log" <<'PY'
          import pathlib, re, sys
          errors, work = [pathlib.Path(path).read_text() for path in sys.argv[1:]]
