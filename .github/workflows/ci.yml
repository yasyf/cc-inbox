name: CI

on:
  workflow_call:
    inputs:
      commit:
        description: Exact commit to validate
        required: true
        type: string
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact commit to validate
        required: true
        type: string

concurrency:
  group: ci-${{ inputs.commit || github.ref }}
  cancel-in-progress: ${{ !inputs.commit && github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
      - name: Validate native workflow contracts
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color
          python3 .github/scripts/test-native-release-gates.py

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/checkout@v7
        with:
          ref: 0b83dbc7fc55f29e552ecafb6cd2a6206d1f57b2
          path: .ci-old
      - uses: actions/checkout@v7
        with:
          ref: 722f03bcbaadf335f6ee9cb7d2c4b57e274f942e
          path: .ci-recipients-baseline
      - uses: actions/checkout@v7
        with:
          ref: e08497bf9ce5880788f6103a949e034c9ed13fc4
          path: .ci-grep-baseline
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Build immutable 0.41.1 store compatibility probe
        run: |
          cci_old_store_probe="$RUNNER_TEMP/cci-old-store-probe"
          test "$(git -C .ci-old rev-parse HEAD)" = 0b83dbc7fc55f29e552ecafb6cd2a6206d1f57b2
          mkdir -p .ci-old/cmd/compat-probe
          cp internal/store/testdata/compat-probe/main.go .ci-old/cmd/compat-probe/main.go
          cd .ci-old
          go build -p 2 -o "$cci_old_store_probe" ./cmd/compat-probe
          test -x "$cci_old_store_probe"
          printf 'CCI_OLD_STORE_PROBE=%s\n' "$cci_old_store_probe" >> "$GITHUB_ENV"
      - name: Test (race)
        run: go test -race ./...
      - name: Post operation counts and scaling
        run: |
          go test -run 'TestBindLaneExistingCursorDoesNotReadRecordHistory|TestOpenCurrentSchemaDoesNotWaitForLocks|TestOpenWaitsForConcurrentSchemaUpgrade|TestConcurrentColdOpenKeepsMigrationSerialized' -v ./internal/store
          go test -run '^$' -bench '^BenchmarkBindLaneExistingCursor$' -benchtime=100x -benchmem ./internal/store
      - name: Physical index comparisons, compatibility, and build cost
        run: |
          test -x "$CCI_OLD_STORE_PROBE"
          go test -run 'TestRegisteredLaneComparisonsStayBounded|TestExistingStoreOpenDoesNotBuildPhysicalIndexes|TestMaintainIndexes|TestPhysicalIndexes' -v ./internal/store
      - name: Recipient identity and targeted session query costs
        run: |
          test "$(git -C .ci-recipients-baseline rev-parse HEAD)" = 722f03bcbaadf335f6ee9cb7d2c4b57e274f942e
          cp internal/cli/recipient_identity_test.go .ci-recipients-baseline/internal/cli/recipient_identity_test.go
          (cd .ci-recipients-baseline && go test -run '^TestPostRecipientUsesHarnessSessionIdentity$' -v ./internal/cli)
          go test -run '^TestPostRecipientUsesHarnessSessionIdentity$' -v ./internal/cli
          go test -run '^TestRecipientLaneQueryUsesTargetedIndex$' -v ./internal/store
      - name: Grep actual caller operation counts and paged output equivalence
        run: |
          test "$(git -C .ci-grep-baseline rev-parse HEAD)" = e08497bf9ce5880788f6103a949e034c9ed13fc4
          cp internal/cli/grep_cost_test.go .ci-grep-baseline/internal/cli/grep_cost_test.go
          cp internal/inbox/grep_internal_test.go .ci-grep-baseline/internal/inbox/grep_internal_test.go
          mkdir -p "$RUNNER_TEMP/cci-grep-errors"
          (cd .ci-grep-baseline && CCI_GREP_SNAPSHOTS="$RUNNER_TEMP/cci-grep-errors" CCI_GREP_SNAPSHOT_WRITE=1 go test -run '^TestGrepPreserves|^TestGrepReplyMetadataErrorAttribution$' -v ./internal/inbox)
          (cd .ci-grep-baseline && CCI_GREP_EXPECT_PAGED=1 go test -run '^TestGrepReadsHistoryOnceForAnnotations$' -v ./internal/cli)
          go test -run '^TestGrepReadsHistoryOnceForAnnotations$' -v ./internal/cli
          go test -run '^TestRepliesSelectionExceedsVariableLimit$' -v ./internal/store
          CCI_GREP_SNAPSHOTS="$RUNNER_TEMP/cci-grep-errors" go test -run '^TestGrepMatchesPagedOutput$|^TestGrepPreserves|^TestGrepReplyMetadataErrorAttribution$' -v ./internal/inbox
      - name: Build
        run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
      - name: Plugin manifests parse and the descriptor template renders
        run: |
          jq -e .name plugin/.claude-plugin/plugin.json .claude-plugin/marketplace.json
          jq -e '.hooks | length == 6' plugin/hooks/hooks.json
          test -L plugin/bin/cci
          tail -n +2 plugin/descriptor/cci.binrun.tmpl | sed -E 's/__SIZE_[A-Z0-9_]+__/1/g' | jq -e '.platforms | length == 4'
