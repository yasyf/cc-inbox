name: CI

on:
  workflow_call:
    inputs:
      commit:
        description: Exact commit to validate
        required: true
        type: string
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact commit to validate
        required: true
        type: string

concurrency:
  group: ci-${{ inputs.commit || github.ref }}
  cancel-in-progress: ${{ inputs.commit == '' && github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate native workflow contracts
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color
          python3 .github/scripts/test-native-release-gates.py
          go build -o "$RUNNER_TEMP/release-version" ./scripts/release-version
          RELEASE_VERSION_COMPARE="$RUNNER_TEMP/release-version" python3 .github/scripts/test-release-main-sync.py

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'pull_request' || inputs.commit != '') && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    env:
      TAIL_COST_TESTS: '^TestTailRecipientHistoryBaseline$|^TestTailResolverHistoryBaseline$|^TestTailPreservesRequested80000JSONRecords$|^TestTailNewestLimitDoesNotWalkSameDriveHistory$|^TestTailPeerFanInKeepsNewestLookupBounded$'
      TIMESTAMP_DIAGNOSTIC_TESTS: '^TestTimestampIndexCLIWork$|^TestTimestampIndexDiagnosticWork$|^TestTimestampIndexNativeParity$'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/checkout@v7
        with:
          ref: cc7485ab2ca7cda03f7790b38bdb0312b26fbcae
          path: .ci-audience-current491
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: cc7485ab2ca7cda03f7790b38bdb0312b26fbcae
          path: .ci-timestamp-index-baseline
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 4e6e169dee4f18963df7fd3e00f4d5b89ee40891
          path: .ci-stream-idle-baseline
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 0b83dbc7fc55f29e552ecafb6cd2a6206d1f57b2
          path: .ci-old
      - uses: actions/checkout@v7
        with:
          ref: 722f03bcbaadf335f6ee9cb7d2c4b57e274f942e
          path: .ci-recipients-baseline
      - uses: actions/checkout@v7
        with:
          ref: e08497bf9ce5880788f6103a949e034c9ed13fc4
          path: .ci-grep-baseline
      - uses: actions/checkout@v7
        with:
          ref: c148e0dc6970d4d5f446d77ba62d8a4060e0156c
          path: .ci-tail-baseline
      - uses: actions/checkout@v7
        with:
          ref: 838d6a6ad8ec051bd9ec09070785d3b838f8398a
          path: .ci-native-tail-baseline
      - uses: actions/checkout@v7
        with:
          ref: e101a16aa7d3d3023e6a0e8cd5fecca718e2c243
          path: .ci-native-tail-null-baseline
      - uses: actions/checkout@v7
        with:
          ref: a578e6f0ffcf53b3f888ba7b262d740ac5c6cd64
          path: .ci-lane-score-baseline
      - uses: actions/checkout@v7
        with:
          ref: b7da336975a6651226912c5c129a38bec9c0e3da
          path: .ci-incident-negative
      - uses: actions/checkout@v7
        with:
          ref: e65cf4da214ea889e729c7cfdae79a8eb4f6cec0
          path: .ci-incident-registration-negative
      - uses: actions/checkout@v7
        with:
          ref: 23dcba01c1512bf876f6caf6e431cdc0f3731ec7
          path: .ci-incident-registration-window-negative
      - uses: actions/checkout@v7
        with:
          ref: e9610dc3fc29a2d3aa8fb342363adacf130c4ed5
          path: .ci-incident-shared-node-negative
      - uses: actions/checkout@v7
        with:
          ref: 87dab0b9b17cd755721a4c0d74ec9488618c2ae9
          path: .ci-grep-selected-baseline
      - uses: actions/checkout@v7
        with:
          ref: 5e61c5bc11d417c601889cac1393b346d17a44cb
          path: .ci-mesh-export-baseline
      - uses: actions/checkout@v7
        with:
          ref: e2ef260846d7afb2850cc503dc6cde57baa78487
          path: .ci-mesh-frontier-negative
      - uses: actions/checkout@v7
        with:
          ref: 2bd181b53ad0384b284e8440d02b2db0a5c75fcc
          path: .ci-mesh-body-baseline
      - uses: actions/checkout@v7
        with:
          ref: a578e6f0ffcf53b3f888ba7b262d740ac5c6cd64
          path: .ci-openamong-oracle
      - uses: actions/checkout@v7
        with:
          ref: 53c067b27a53ac3798753309221a6b4f4190e5b7
          path: .ci-openamong-negative
      - uses: actions/checkout@v7
        with:
          ref: 838d6a6ad8ec051bd9ec09070785d3b838f8398a
          path: .ci-hook-owed-baseline
      - uses: actions/checkout@v7
        with:
          ref: 67a9ba0415a718dd7ed61773695da93a8061e7ef
          path: .ci-selected-seqs-baseline
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Audience kind candidates and immutable491 work control
        run: |
          cp internal/cli/audience_query_cost_test.go .ci-audience-current491/internal/cli/
          cp internal/store/audience_plan_internal_test.go .ci-audience-current491/internal/store/
          test "$(git -C .ci-audience-current491 rev-parse HEAD)" = cc7485ab2ca7cda03f7790b38bdb0312b26fbcae
          if (cd .ci-audience-current491 && CCI_AUDIENCE_REQUIRE_BOUNDED_KIND=1 go test -count=1 -run '^TestAudience' -v ./internal/cli ./internal/store) > "$RUNNER_TEMP/audience491-old.log" 2>&1; then
            cat "$RUNNER_TEMP/audience491-old.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/audience491-old.log"
          for verb in tail grep; do
            for history in 32 10000; do
              grep -F "AUDIENCE_KIND_BOUND_EXCEEDED verb=$verb history=$history " "$RUNNER_TEMP/audience491-old.log"
            done
          done
          for operation in query count; do
            for history in 32 10000; do
              grep -F "AUDIENCE_STORE_BOUND_EXCEEDED operation=$operation history=$history unique_kinds=1 " "$RUNNER_TEMP/audience491-old.log"
            done
          done
          CCI_AUDIENCE_REQUIRE_BOUNDED_KIND=1 go test -count=1 -race -run '^TestAudience' -v ./internal/cli ./internal/store
      - name: Timestamp index same-SQL configuration diagnostics
        run: |
          set -o pipefail
          test "$(git -C .ci-timestamp-index-baseline rev-parse HEAD)" = cc7485ab2ca7cda03f7790b38bdb0312b26fbcae
          cp internal/cli/timestamp_index_diagnostic_test.go .ci-timestamp-index-baseline/internal/cli/
          cp internal/store/timestamp_index_diagnostic_internal_test.go .ci-timestamp-index-baseline/internal/store/
          if (cd .ci-timestamp-index-baseline && CCI_TIMESTAMP_REQUIRE_MISSING_BOUND=1 go test -count=1 -run '^TestTimestampIndex(DiagnosticWork|CLIWork)$' -v ./internal/cli ./internal/store) > "$RUNNER_TEMP/timestamp-index-old-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/timestamp-index-old-negative.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/timestamp-index-old-negative.log"
          for operation in grep query count; do
            for history in 32 10000; do
              grep -F "TIMESTAMP_INDEX_UNBOUNDED operation=$operation history=$history index=missing peer=true " "$RUNNER_TEMP/timestamp-index-old-negative.log"
            done
          done
          (cd .ci-timestamp-index-baseline && go test -count=1 -race -run '^TestTimestampIndex' -v ./internal/cli ./internal/store) 2>&1 | tee "$RUNNER_TEMP/timestamp-index-old-diagnostic.log"
          go test -count=1 -race -run '^TestTimestampIndex' -v ./internal/cli ./internal/store 2>&1 | tee "$RUNNER_TEMP/timestamp-index-current-diagnostic.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: timestamp-index-diagnostic-${{ matrix.os }}-${{ inputs.commit || github.sha }}
          path: ${{ runner.temp }}/timestamp-index-*.log
          if-no-files-found: error
      - name: SSE idle queries, immutable history control, and commit freshness
        run: |
          test "$(git -C .ci-stream-idle-baseline rev-parse HEAD)" = 4e6e169dee4f18963df7fd3e00f4d5b89ee40891
          cp internal/server/stream_idle_cost_test.go .ci-stream-idle-baseline/internal/server/
          if (cd .ci-stream-idle-baseline && go test -count=1 -run '^TestStreamIdleQueriesDoNotRepeatUnmatchedHistory$' -v ./internal/server) > "$RUNNER_TEMP/stream-idle-old.log" 2>&1; then
            cat "$RUNNER_TEMP/stream-idle-old.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/stream-idle-old.log"
          grep -F 'for 32 unmatched rows, want 1' "$RUNNER_TEMP/stream-idle-old.log"
          grep -F 'for 10000 unmatched rows, want 1' "$RUNNER_TEMP/stream-idle-old.log"
          go test -count=1 -race -run '^TestChangeVersion' -v ./internal/store
          go test -count=1 -race -run '^TestStream' -v ./internal/server
      - name: Vet
        run: go vet ./...
      - name: Build immutable 0.41.1 store compatibility probe
        run: |
          cci_old_store_probe="$RUNNER_TEMP/cci-old-store-probe"
          test "$(git -C .ci-old rev-parse HEAD)" = 0b83dbc7fc55f29e552ecafb6cd2a6206d1f57b2
          mkdir -p .ci-old/cmd/compat-probe
          cp internal/store/testdata/compat-probe/main.go .ci-old/cmd/compat-probe/main.go
          cd .ci-old
          go build -p 2 -o "$cci_old_store_probe" ./cmd/compat-probe
          test -x "$cci_old_store_probe"
          printf 'CCI_OLD_STORE_PROBE=%s\n' "$cci_old_store_probe" >> "$GITHUB_ENV"
      - name: Cask handoff waits for committed installation
        run: |
          test "$(git -C .ci-mesh-export-baseline rev-parse HEAD)" = 5e61c5bc11d417c601889cac1393b346d17a44cb
          cp internal/version/cask_readiness_test.go .ci-mesh-export-baseline/internal/version/
          if (cd .ci-mesh-export-baseline && go test -count=1 -run '^TestCaskHandoffWaitsForCommittedReceipt$' -v ./internal/version) > "$RUNNER_TEMP/cci-cask-readiness-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/cci-cask-readiness-negative.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/cci-cask-readiness-negative.log"
          grep -F 'staged cask selected before committed receipt' "$RUNNER_TEMP/cci-cask-readiness-negative.log"
          go test -count=1 -race -v ./internal/version
      - name: Incident old-writer native provisioning budget
        run: CCI_INCIDENT_NATIVE_BUDGET=1 go test -count=1 -run '^TestIncidentProvisioningSerializesPreopenedOldWriter$' -v ./internal/store
      - name: Incident native lifecycle, immutable failure controls, and writer budget
        run: |
          test "$(git -C .ci-incident-negative rev-parse HEAD)" = b7da336975a6651226912c5c129a38bec9c0e3da
          cp internal/store/incident_alias_internal_test.go internal/store/incident_owner_internal_test.go .ci-incident-negative/internal/store/
          if (cd .ci-incident-negative && go test -count=1 -run '^TestIncidentWatchPreservesSymlinkDotDotRoutes$|^TestIncidentColdOwnerDiscardsRetiredPathBeforeFileAccess$|^TestIncidentProjectionRejectsConcurrentProjectorsBeforePublication$' -v ./internal/store) > "$RUNNER_TEMP/cci-incident-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/cci-incident-negative.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/cci-incident-negative.log"
          grep -F 'native watch stale after write' "$RUNNER_TEMP/cci-incident-negative.log"
          grep -F 'retired canonical body was inspected' "$RUNNER_TEMP/cci-incident-negative.log"
          grep -F 'concurrent incident projector accepted; reversed publication permanently regressed membership' "$RUNNER_TEMP/cci-incident-negative.log"
          cp internal/store/incident_registration_race_internal_test.go .ci-incident-registration-negative/internal/store/
          if (cd .ci-incident-registration-negative && go test -count=1 -run '^TestIncidentRegistrationUsesBoundObjectType$' -v ./internal/store) > "$RUNNER_TEMP/cci-incident-registration-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/cci-incident-registration-negative.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/cci-incident-registration-negative.log"
          grep -F 'watch registration type race retained stale hold' "$RUNNER_TEMP/cci-incident-registration-negative.log"
          python3 .github/scripts/incident-registration-syscall-seam.py .ci-incident-registration-window-negative
          cp internal/store/incident_registration_window_*test.go .ci-incident-registration-window-negative/internal/store/
          if (cd .ci-incident-registration-window-negative && go test -count=1 -run '^TestIncidentPostOpenRegistrationReplacementRemainsFresh$|^TestIncidentLiveRetiredPendingRegistrationSkipsPathInspection$' -v ./internal/store) > "$RUNNER_TEMP/cci-incident-registration-window-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/cci-incident-registration-window-negative.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/cci-incident-registration-window-negative.log"
          grep -F 'post-open registration replacement retained stale hold' "$RUNNER_TEMP/cci-incident-registration-window-negative.log"
          grep -F 'live retired pending registration inspected path' "$RUNNER_TEMP/cci-incident-registration-window-negative.log"
          test "$(git -C .ci-incident-shared-node-negative rev-parse HEAD)" = e9610dc3fc29a2d3aa8fb342363adacf130c4ed5
          cp internal/store/incident_shared_rebind_internal_test.go .ci-incident-shared-node-negative/internal/store/
          if (cd .ci-incident-shared-node-negative && go test -count=1 -run '^TestIncidentSharedAncestorReplacementRemainsFresh$|^TestIncidentSharedChangedRegistrationRefreshesOnce$' -v ./internal/store) > "$RUNNER_TEMP/cci-incident-shared-node-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/cci-incident-shared-node-negative.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/cci-incident-shared-node-negative.log"
          grep -F 'shared ancestor retained stale membership' "$RUNNER_TEMP/cci-incident-shared-node-negative.log"
          grep -F 'shared changed registration did not refresh' "$RUNNER_TEMP/cci-incident-shared-node-negative.log"
          go test -count=1 -race -run '^TestIncident' -skip '^TestIncidentProvisioningSerializesPreopenedOldWriter$' -v ./internal/store ./internal/cli
      - name: Hook owed indexed closure and immutable output
        run: |
          test "$(git -C .ci-hook-owed-baseline rev-parse HEAD)" = 838d6a6ad8ec051bd9ec09070785d3b838f8398a
          cp internal/hook/owed_cost_test.go .ci-hook-owed-baseline/internal/hook/
          mkdir -p "$RUNNER_TEMP/cci-hook-owed-snapshots"
          (cd .ci-hook-owed-baseline && CCI_HOOK_OWED_EXPECT_GLOBAL=1 CCI_HOOK_OWED_SNAPSHOTS="$RUNNER_TEMP/cci-hook-owed-snapshots" CCI_HOOK_OWED_SNAPSHOT_WRITE=1 go test -count=1 -run '^TestHookOwedDoesNotDecodeUnrelatedCloserHistory$' -v ./internal/hook)
          if (cd .ci-hook-owed-baseline && go test -count=1 -run '^TestHookOwedDoesNotDecodeUnrelatedCloserHistory$' -v ./internal/hook) > "$RUNNER_TEMP/cci-hook-owed-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/cci-hook-owed-negative.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/cci-hook-owed-negative.log"
          grep -F 'hook owed refs_reads=10002 want=2 history=10000' "$RUNNER_TEMP/cci-hook-owed-negative.log"
          CCI_HOOK_OWED_SNAPSHOTS="$RUNNER_TEMP/cci-hook-owed-snapshots" go test -count=1 -race -run '^TestHookOwedDoesNotDecodeUnrelatedCloserHistory$' -v ./internal/hook
          go test -count=1 -race -run '^TestOpenToSelected' -v ./internal/store
      - name: Mesh exported body prefix and immutable allocation control
        run: |
          test "$(git -C .ci-mesh-body-baseline rev-parse HEAD)" = 2bd181b53ad0384b284e8440d02b2db0a5c75fcc
          cp internal/store/replicate_body_cost_test.go .ci-mesh-body-baseline/internal/store/
          (cd .ci-mesh-body-baseline && CCI_MESH_BODY_EXPECT_GLOBAL=1 go test -count=1 -run '^TestNewestExportBoundsSelectedBodyAllocation$|^TestExportBodyPrefixKeepsLineAndUTF8Contract$' -v ./internal/store)
          if (cd .ci-mesh-body-baseline && go test -count=1 -run '^TestNewestExportBoundsSelectedBodyAllocation$' -v ./internal/store) > "$RUNNER_TEMP/cci-mesh-body-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/cci-mesh-body-negative.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/cci-mesh-body-negative.log"
          grep -F 'selected body allocation follows the unread file tail: body_bytes=33554432' "$RUNNER_TEMP/cci-mesh-body-negative.log"
          go test -count=1 -race -run '^TestNewestExportBoundsSelectedBodyAllocation$|^TestExportBodyPrefixKeepsLineAndUTF8Contract$|^TestARecordsBodyFileTravelsWithItIntoTheReceiversBlobs$' -v ./internal/store
      - name: Mesh export indexed prefix and immutable contract
        run: |
          test "$(git -C .ci-mesh-export-baseline rev-parse HEAD)" = 5e61c5bc11d417c601889cac1393b346d17a44cb
          cp internal/mesh/export_cost_test.go .ci-mesh-export-baseline/internal/mesh/
          (cd .ci-mesh-export-baseline && CCI_MESH_EXPECT_GLOBAL=1 go test -count=1 -run '^TestMeshExportHistoryBaseline$' -v ./internal/mesh)
          if (cd .ci-mesh-export-baseline && go test -count=1 -run '^TestMeshExportHistoryBaseline$' -v ./internal/mesh) > "$RUNNER_TEMP/cci-mesh-history-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/cci-mesh-history-negative.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/cci-mesh-history-negative.log"
          grep -F 'text_reads=20002 want=snapshot/1/4' "$RUNNER_TEMP/cci-mesh-history-negative.log"
          test "$(git -C .ci-mesh-frontier-negative rev-parse HEAD)" = e2ef260846d7afb2850cc503dc6cde57baa78487
          cp internal/mesh/export_frontier_test.go .ci-mesh-frontier-negative/internal/mesh/
          if (cd .ci-mesh-frontier-negative && go test -count=1 -run '^TestMeshExportRevisionNeverIncludesUnvalidatedConcurrentAppend$' -v ./internal/mesh) > "$RUNNER_TEMP/cci-mesh-frontier-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/cci-mesh-frontier-negative.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/cci-mesh-frontier-negative.log"
          grep -F 'mesh revision included unvalidated concurrent append: seq=3 want=2' "$RUNNER_TEMP/cci-mesh-frontier-negative.log"
          go test -count=1 -race -run '^TestIndexedMeshExport|^TestMeshExportHistoryBaseline$|^TestMeshExportRevisionNeverIncludesUnvalidatedConcurrentAppend$' -v ./internal/mesh

      - name: Test (race)
        run: go test -race -skip "$TAIL_COST_TESTS|^TestIncident|$TIMESTAMP_DIAGNOSTIC_TESTS" ./...
      - name: Post operation counts and scaling
        run: |
          go test -run 'TestBindLaneExistingCursorDoesNotReadRecordHistory|TestOpenCurrentSchemaDoesNotWaitForLocks|TestOpenWaitsForConcurrentSchemaUpgrade|TestConcurrentColdOpenKeepsMigrationSerialized' -v ./internal/store
          go test -run '^$' -bench '^BenchmarkBindLaneExistingCursor$' -benchtime=100x -benchmem ./internal/store
      - name: Physical index comparisons, compatibility, and build cost
        run: |
          test -x "$CCI_OLD_STORE_PROBE"
          go test -run 'TestRegisteredLaneComparisonsStayBounded|TestExistingStoreOpenDoesNotBuildPhysicalIndexes|TestMaintainIndexes|TestPhysicalIndexes' -v ./internal/store
      - name: Recipient identity and targeted session query costs
        run: |
          test "$(git -C .ci-recipients-baseline rev-parse HEAD)" = 722f03bcbaadf335f6ee9cb7d2c4b57e274f942e
          cp internal/cli/recipient_identity_test.go .ci-recipients-baseline/internal/cli/recipient_identity_test.go
          (cd .ci-recipients-baseline && go test -run '^TestPostRecipientUsesHarnessSessionIdentity$' -v ./internal/cli)
          go test -run '^TestPostRecipientUsesHarnessSessionIdentity$' -v ./internal/cli
          go test -run '^TestRecipientLaneQueryUsesTargetedIndex$' -v ./internal/store
      - name: Grep actual caller operation counts and paged output equivalence
        run: |
          test "$(git -C .ci-grep-baseline rev-parse HEAD)" = e08497bf9ce5880788f6103a949e034c9ed13fc4
          cp internal/cli/grep_cost_test.go .ci-grep-baseline/internal/cli/grep_cost_test.go
          cp internal/inbox/grep_internal_test.go .ci-grep-baseline/internal/inbox/grep_internal_test.go
          (cd .ci-grep-baseline && CCI_GREP_EXPECT_PAGED=1 go test -run '^TestGrepReadsHistoryOnceForAnnotations$' -v ./internal/cli)
          go test -run '^TestGrepReadsHistoryOnceForAnnotations$' -v ./internal/cli
          go test -run '^TestRepliesSelectionExceedsVariableLimit$' -v ./internal/store
          go test -run '^TestGrepMatchesPagedOutput$|^TestGrepPreserves|^TestGrepReplyMetadataErrorAttribution$' -v ./internal/inbox
      - name: Indexed selected reply counts, current public CLI oracle, and required index lifecycle
        run: |
          test "$(git -C .ci-grep-selected-baseline rev-parse HEAD)" = 87dab0b9b17cd755721a4c0d74ec9488618c2ae9
          cp internal/cli/grep_cost_test.go internal/cli/grep_selected_cost_test.go .ci-grep-selected-baseline/internal/cli/
          (cd .ci-grep-selected-baseline && CCI_GREP_EXPECT_GLOBAL_REPLY_SCAN=1 go test -count=1 -run '^TestGrepSelectedRepliesDoNotReadUnrelatedRecords$' -v ./internal/cli)
          (cd .ci-grep-selected-baseline && go build -p 2 -o "$RUNNER_TEMP/cci-grep-current-baseline" ./cmd/cci)
          go build -p 2 -o "$RUNNER_TEMP/cci-grep-current" ./cmd/cci
          CCI_GREP_CURRENT_BASELINE="$RUNNER_TEMP/cci-grep-current-baseline" CCI_GREP_CURRENT_CLI="$RUNNER_TEMP/cci-grep-current" go test -count=1 -run '^TestGrepSelectedRepliesDoNotReadUnrelatedRecords$|^TestGrepIndexedRepliesPreservePublicErrorsAndBytes$' -v ./internal/cli
          go test -count=1 -run '^TestSelectedReply|^TestGrepReplyIndex' -v ./internal/store
          CCI_GREP_REPLY_INDEX_ROWS=250000 go test -count=1 -run '^TestGrepReplyIndexProvisioningWithinWriterBudget$' -v ./internal/store
      - name: Build
        run: go build ./...
      - name: Selected internal sequences, immutable history cost, and current status
        run: |
          test "$(git -C .ci-selected-seqs-baseline rev-parse HEAD)" = 67a9ba0415a718dd7ed61773695da93a8061e7ef
          cp internal/store/selected_history_internal_test.go .ci-selected-seqs-baseline/internal/store/
          if (cd .ci-selected-seqs-baseline && CCI_SELECTED_HISTORY_NEGATIVE=1 go test -count=1 -run '^TestSelectedRecordsHistoryScanNegative$' -v ./internal/store) > "$RUNNER_TEMP/selected-history-old.log" 2>&1; then
            cat "$RUNNER_TEMP/selected-history-old.log"
            echo "immutable unrestricted history query unexpectedly met selected lookup bound"
            exit 1
          fi
          cat "$RUNNER_TEMP/selected-history-old.log"
          grep -F 'for 32 history rows, want <=3' "$RUNNER_TEMP/selected-history-old.log"
          grep -F 'for 10000 history rows, want <=3' "$RUNNER_TEMP/selected-history-old.log"
          (cd .ci-selected-seqs-baseline && go build -p 2 -o "$RUNNER_TEMP/cci-selected-old" ./cmd/cci)
          go build -p 2 -o "$RUNNER_TEMP/cci-selected-current" ./cmd/cci
          go test -count=1 -race -run '^TestSelectedRecords' -v ./internal/store
          CCI_SELECTED_OLD_CLI="$RUNNER_TEMP/cci-selected-old" CCI_SELECTED_CURRENT_CLI="$RUNNER_TEMP/cci-selected-current" go test -count=1 -race -run '^TestTailSelected|^TestNativeTailSelected' -v ./internal/cli
      - uses: actions/checkout@v7
        with:
          ref: af644830c49d339afe038477762152bc80c7650f
          path: .ci-native-tail-fixture-baseline
          persist-credentials: false
      - name: Native HTTP fixture setup phase baseline
        run: |
          test "$(git -C .ci-native-tail-fixture-baseline rev-parse HEAD)" = af644830c49d339afe038477762152bc80c7650f
          (cd .ci-native-tail-fixture-baseline && CCI_NATIVE_TAIL_FIXTURE_TIMINGS=1 go test -count=1 -race -run '^TestNativeTailRejectsNullArgumentBeforeCore$' -v ./internal/cli)
      - name: Native HTTP fixture setup phase attribution
        run: CCI_NATIVE_TAIL_FIXTURE_TIMINGS=1 go test -count=1 -race -run '^TestNativeTailRejectsNullArgumentBeforeCore$' -v ./internal/cli
      - name: Tail operation counts and full requested output
        run: |
          test "$(git -C .ci-tail-baseline rev-parse HEAD)" = c148e0dc6970d4d5f446d77ba62d8a4060e0156c
          cp internal/cli/tail_cost_test.go internal/cli/tail_limit_cost_test.go .ci-tail-baseline/internal/cli/
          (cd .ci-tail-baseline && CCI_TAIL_EXPECT_GLOBAL_SCANS=1 go test -run "$TAIL_COST_TESTS" -v ./internal/cli)
          go test -run "$TAIL_COST_TESTS" -v ./internal/cli
      - name: Selected opener closure work and error scope
        run: |
          cp internal/server/openamong_refutation_test.go .ci-openamong-oracle/internal/server/
          cp internal/server/openamong_refutation_test.go .ci-openamong-negative/internal/server/
          (cd .ci-openamong-oracle && go test -run '^TestOpenAmongCandidatePreservesSelectedClosure$' -v ./internal/server)
          if (cd .ci-openamong-negative && go test -run '^TestOpenAmongCandidatePreservesSelectedClosure$' -v ./internal/server) > "$RUNNER_TEMP/openamong-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/openamong-negative.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/openamong-negative.log"
          grep -F 'FAIL: TestOpenAmongCandidatePreservesSelectedClosure/foreign_nonmatching_typed_suffix' "$RUNNER_TEMP/openamong-negative.log"
          grep -F 'FAIL: TestOpenAmongCandidatePreservesSelectedClosure/raw_topic_bytes' "$RUNNER_TEMP/openamong-negative.log"
          grep -F 'FAIL: TestOpenAmongCandidatePreservesSelectedClosure/Go-valid_deep_refs' "$RUNNER_TEMP/openamong-negative.log"
          go test -run '^TestOpenAmongCandidatePreservesSelectedClosure$' -v ./internal/server
          go test -run '^TestOpenAmongHTTPHistoryBaseline$|^TestOpenAmongUnrelatedCorruptionBaseline$|^TestOpenAmongResolverCandidateErrors$|^TestSelectedClosure' -v ./internal/server ./internal/store
          CCI_CLOSER_PROVISION_ROWS=250000 go test -run '^TestSelectedClosureProvisioningWithinWriterBudget$' -v ./internal/store
      - name: Record membership maintenance, bounded plans, and unbounded predicate equivalence
        run: |
          go test -run '^TestRecordMembershipsFollowEveryWriter$|^TestRecordMembershipProvisioningSerializesOldWriter$|^TestInitializationInstallsMembershipsOnlyWhileMigrating$|^TestMaintainIndexesRefusesForeignMembershipObjects$|^TestBoundedReadPlansStayIndexed$|^TestBoundedReadsMatchUnboundedPredicates$' -v ./internal/store
          CCI_MEMBERSHIP_PROVISION_ROWS=200000 go test -run '^TestMaintainIndexesProvisionsMembershipsWithinWriterBudget$' -v ./internal/store
      - name: Indexed lane tips, immutable output and errors, and writer lifecycle
        run: |
          test "$(git -C .ci-lane-score-baseline rev-parse HEAD)" = a578e6f0ffcf53b3f888ba7b262d740ac5c6cd64
          cp internal/cli/daemon_lanes_equivalence_test.go .ci-lane-score-baseline/internal/cli/
          mkdir -p "$RUNNER_TEMP/cci-lane-snapshots"
          (cd .ci-lane-score-baseline && CCI_LANE_SNAPSHOTS="$RUNNER_TEMP/cci-lane-snapshots" CCI_LANE_SNAPSHOT_WRITE=1 go test -count=1 -run '^TestDaemonLanePreservesNativeOutputAndErrors$|^TestDaemonLaneScoreTieIsNotMaximumSequence$' -v ./internal/cli)
          CCI_LANE_SNAPSHOTS="$RUNNER_TEMP/cci-lane-snapshots" go test -count=1 -run '^TestDaemonLane' -v ./internal/cli
          go test -run '^TestLaneScore' -v ./internal/store
          CCI_LANE_INDEX_ROWS=250000 go test -run '^TestLaneScoreIndexProvisioningWithinWriterBudget$' -v ./internal/store

      - name: Native HTTP Tail immutable CLI bytes, errors, identity, freshness, and zero writes
        run: |
          test "$(git -C .ci-native-tail-null-baseline rev-parse HEAD)" = e101a16aa7d3d3023e6a0e8cd5fecca718e2c243
          cp internal/cli/native_tail_reference_test.go internal/cli/native_tail_fixture_test.go internal/cli/tail_http_test.go .ci-native-tail-null-baseline/internal/cli/
          if (cd .ci-native-tail-null-baseline && go test -run '^TestNativeTailRejectsNullArgumentBeforeCore$' -v ./internal/cli) > "$RUNNER_TEMP/cci-native-tail-null-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/cci-native-tail-null-negative.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/cci-native-tail-null-negative.log"
          grep -F 'null argv reached core: status=200' "$RUNNER_TEMP/cci-native-tail-null-negative.log"
          test "$(git -C .ci-native-tail-baseline rev-parse HEAD)" = 838d6a6ad8ec051bd9ec09070785d3b838f8398a
          cp internal/cli/native_tail_reference_test.go internal/cli/native_tail_fixture_test.go .ci-native-tail-baseline/internal/cli/
          mkdir -p "$RUNNER_TEMP/cci-native-tail-snapshots"
          (cd .ci-native-tail-baseline && CCI_NATIVE_TAIL_SNAPSHOTS="$RUNNER_TEMP/cci-native-tail-snapshots" CCI_NATIVE_TAIL_SNAPSHOT_WRITE=1 go test -count=1 -run '^TestNativeTailCLIReference$' ./internal/cli)
          CCI_NATIVE_TAIL_SNAPSHOTS="$RUNNER_TEMP/cci-native-tail-snapshots" go test -count=1 -race -run '^TestNativeTailCLIReference$' -v ./internal/cli
          CCI_NATIVE_TAIL_SNAPSHOTS="$RUNNER_TEMP/cci-native-tail-snapshots" go test -count=1 -race -run '^TestNativeTailHTTPParity$' -v ./internal/cli
          CCI_NATIVE_TAIL_SNAPSHOTS="$RUNNER_TEMP/cci-native-tail-snapshots" go test -count=1 -race -run '^TestNativeTail' -skip '^TestNativeTail(CLIReference|HTTPParity)$' -v ./internal/cli


  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
      - name: Plugin manifests parse and the descriptor template renders
        run: |
          jq -e .name plugin/.claude-plugin/plugin.json .claude-plugin/marketplace.json
          jq -e '.hooks | length == 6' plugin/hooks/hooks.json
          test -L plugin/bin/cci
          tail -n +2 plugin/descriptor/cci.binrun.tmpl | sed -E 's/__SIZE_[A-Z0-9_]+__/1/g' | jq -e '.platforms | length == 4'

  provisioning-candidate:
    name: Prepublication Darwin arm64 provisioning candidate
    needs: [test, lint, vuln, plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build source-bound provisioning candidate
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          cci_candidate_dir="$RUNNER_TEMP/cci-tail-candidate"
          mkdir -p "$cci_candidate_dir"
          cci_candidate_commit="$(git rev-parse HEAD)"
          go build -mod=readonly -trimpath -buildvcs=true -ldflags "-s -w -X github.com/yasyf/cc-inbox/internal/version.Commit=$cci_candidate_commit" -o "$cci_candidate_dir/cci" ./cmd/cci
          test -z "$(git status --porcelain)"
          go version -m "$cci_candidate_dir/cci" > "$cci_candidate_dir/build-info.txt"
          CCI_CANDIDATE_DIR="$cci_candidate_dir" python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          folder = pathlib.Path(os.environ["CCI_CANDIDATE_DIR"])
          descriptor = {
              "purpose": "root-reviewed prepublication physical membership provisioning only",
              "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "source_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "binary_sha256": hashlib.sha256((folder / "cci").read_bytes()).hexdigest(),
              "os": "darwin",
              "arch": "arm64",
              "version": "dev",
              "release_signature": "none; verified CI candidate, not a published signed release",
          }
          (folder / "descriptor.json").write_text(json.dumps(descriptor, indent=2) + "\n")
          PY
          tar -czf "$cci_candidate_dir/cci-tail-provisioning-darwin-arm64.tar.gz" -C "$cci_candidate_dir" cci build-info.txt descriptor.json
          (cd "$cci_candidate_dir" && sha256sum cci-tail-provisioning-darwin-arm64.tar.gz > checksums.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: cci-tail-provisioning-${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/cci-tail-candidate/cci-tail-provisioning-darwin-arm64.tar.gz
            ${{ runner.temp }}/cci-tail-candidate/checksums.txt
          if-no-files-found: error
          compression-level: 0
