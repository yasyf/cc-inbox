          test "$(git -C .ci-cli-output-baseline rev-parse HEAD)" = 70ea38a2108e20eadf526838d9d97797c63cdcec
          cp internal/cli/native_tail_reference_test.go internal/cli/native_tail_fixture_test.go .ci-native-tail-baseline/internal/cli/
          cp internal/cli/native_tail_reference_test.go internal/cli/native_tail_fixture_test.go .ci-cli-output-baseline/internal/cli/
          mkdir -p "$RUNNER_TEMP/cci-native-tail-snapshots" "$RUNNER_TEMP/cci-native-tail-text-snapshots"
          (cd .ci-native-tail-baseline && CCI_NATIVE_TAIL_SNAPSHOTS="$RUNNER_TEMP/cci-native-tail-snapshots" CCI_NATIVE_TAIL_SNAPSHOT_WRITE=1 go test -count=1 -run '^TestNativeTailCLIReference$' -v ./internal/cli)
          (cd .ci-cli-output-baseline && CCI_NATIVE_TAIL_SNAPSHOTS="$RUNNER_TEMP/cci-native-tail-text-snapshots" CCI_NATIVE_TAIL_SNAPSHOT_WRITE=1 go test -count=1 -run '^TestNativeTailCLIReference$' -v ./internal/cli)
          CCI_NATIVE_TAIL_SNAPSHOTS="$RUNNER_TEMP/cci-native-tail-snapshots" CCI_NATIVE_TAIL_TEXT_SNAPSHOTS="$RUNNER_TEMP/cci-native-tail-text-snapshots" go test -count=1 -run '^TestNativeTailCLIReference$' -v ./internal/cli
          CCI_NATIVE_TAIL_SNAPSHOTS="$RUNNER_TEMP/cci-native-tail-snapshots" CCI_NATIVE_TAIL_TEXT_SNAPSHOTS="$RUNNER_TEMP/cci-native-tail-text-snapshots" go test -count=1 -run '^TestNativeTailHTTPParity$' -v ./internal/cli
          CCI_NATIVE_TAIL_SNAPSHOTS="$RUNNER_TEMP/cci-native-tail-snapshots" CCI_NATIVE_TAIL_TEXT_SNAPSHOTS="$RUNNER_TEMP/cci-native-tail-text-snapshots" go test -count=1 -run '^TestNativeTail' -skip '^TestNativeTail(CLIReference|HTTPParity)$' -v ./internal/cli


  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
      - name: Plugin manifests parse and the descriptor template renders
        run: |
          jq -e .name plugin/.claude-plugin/plugin.json .claude-plugin/marketplace.json
          jq -e '.hooks | length == 7' plugin/hooks/hooks.json
          test -L plugin/bin/cci
          tail -n +2 plugin/descriptor/cci.binrun.tmpl | sed -E 's/__SIZE_[A-Z0-9_]+__/1/g' | jq -e '.platforms | length == 4'
      - name: Every cci MCP server's config is the same in every plugin version, so /reload-plugins keeps it running
        run: jq -e '[.mcpServers[] | (tostring | contains("CLAUDE_PLUGIN_ROOT}") | not) and .env.CLAUDE_PLUGIN_ROOT == ""] | all' plugin/.claude-plugin/plugin.json
      - name: The channel is a server of its own that serves no tools, so no tool call starts it
        run: jq -e '.channels == [{"server":"channel","displayName":"cci"}] and .mcpServers.channel.args == ["channel","--no-tools"] and .mcpServers.cci.args == ["mcp"]' plugin/.claude-plugin/plugin.json

  provisioning-candidate:
    name: Prepublication Darwin arm64 provisioning candidate
    needs: [test, lint, vuln, plugin]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build source-bound provisioning candidate
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          cci_candidate_dir="$RUNNER_TEMP/cci-tail-candidate"
          mkdir -p "$cci_candidate_dir"
          cci_candidate_commit="$(git rev-parse HEAD)"
          go build -mod=readonly -trimpath -buildvcs=true -ldflags "-s -w -X github.com/yasyf/cc-inbox/internal/version.Commit=$cci_candidate_commit" -o "$cci_candidate_dir/cci" ./cmd/cci
          test -z "$(git status --porcelain)"
          go version -m "$cci_candidate_dir/cci" > "$cci_candidate_dir/build-info.txt"
          CCI_CANDIDATE_DIR="$cci_candidate_dir" python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          folder = pathlib.Path(os.environ["CCI_CANDIDATE_DIR"])
          descriptor = {
              "purpose": "root-reviewed prepublication physical membership provisioning only",
              "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "source_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "binary_sha256": hashlib.sha256((folder / "cci").read_bytes()).hexdigest(),
              "os": "darwin",
              "arch": "arm64",
              "version": "dev",
              "release_signature": "none; verified CI candidate, not a published signed release",
          }
          (folder / "descriptor.json").write_text(json.dumps(descriptor, indent=2) + "\n")
          PY
          tar -czf "$cci_candidate_dir/cci-tail-provisioning-darwin-arm64.tar.gz" -C "$cci_candidate_dir" cci build-info.txt descriptor.json
          (cd "$cci_candidate_dir" && sha256sum cci-tail-provisioning-darwin-arm64.tar.gz > checksums.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: cci-tail-provisioning-${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/cci-tail-candidate/cci-tail-provisioning-darwin-arm64.tar.gz
            ${{ runner.temp }}/cci-tail-candidate/checksums.txt
          if-no-files-found: error
          compression-level: 0
