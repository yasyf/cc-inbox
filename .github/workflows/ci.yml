          assert not re.search(r"^--- (?:FAIL|SKIP):", errors + work, re.M)
          assert len(re.findall(r"^--- PASS: TestBoardSameKindSQLPredicateWork ", work, re.M)) == 1
          points = re.findall(r"BOARD_SAME_KIND_SQL_WORK population=(32|10000) record_predicate_evaluations=(\d+)", work)
          assert len(points) == 2 and {int(n) for n, count in points} == {32, 10000}
          values = {int(n): int(count) for n, count in points}
          assert values[32] > 0 and values[32] == values[10000]
          PY
      - name: Immutable board row-rekey negative
        env:
