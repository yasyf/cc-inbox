name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: yasyf/homebrew-tap/.github/workflows/release-go.yml@41f8de6765b3b833ef333b0b98f5683f0e46685b
    secrets: inherit

  descriptor:
    needs: release
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Download release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --dir dist --pattern '*.tar.gz' --pattern 'checksums.txt'
      - name: Render descriptor and sync manifest version
        run: |
          version="${GITHUB_REF_NAME#v}"
          plugin/scripts/render-descriptor.sh dist "$version" > plugin/bin/cci.binrun
          chmod +x plugin/bin/cci.binrun
          jq --arg v "$version" '.version = $v' plugin/.claude-plugin/plugin.json > plugin/.claude-plugin/plugin.json.tmp
          mv plugin/.claude-plugin/plugin.json.tmp plugin/.claude-plugin/plugin.json
      - name: Validate descriptor
        run: go run github.com/yasyf/binrun/cmd/binrun@v0.1.1 -- parse plugin/bin/cci.binrun
      - name: Build the release version comparator
        run: go build -o "$RUNNER_TEMP/release-version" ./scripts/release-version
      - name: Move the tag onto the synced descriptor and land it on main
        id: commit
        env:
          RELEASE_VERSION_COMPARE: ${{ runner.temp }}/release-version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          source_commit="$(git rev-parse HEAD)"
          git add plugin/bin/cci.binrun plugin/.claude-plugin/plugin.json
          if git diff --cached --quiet; then
            echo "${GITHUB_REF_NAME} already carries its descriptor and manifest"
          else
            git commit -m "chore: sync cci.binrun + manifest to ${GITHUB_REF_NAME}"
            git tag -fa "${GITHUB_REF_NAME}" -m "${GITHUB_REF_NAME}"
            git push --force origin "refs/tags/${GITHUB_REF_NAME}"
          fi
          git show HEAD:plugin/bin/cci.binrun > "$RUNNER_TEMP/cci.binrun"
          chmod +x "$RUNNER_TEMP/cci.binrun"
          descriptor_commit="$(git rev-parse HEAD)"
          version="${GITHUB_REF_NAME#v}"
          rejected_main=""
          accepted_main=""
          for attempt in 1 2 3; do
            git fetch --no-tags origin refs/heads/main
            main="$(git rev-parse FETCH_HEAD)"
            if [ "$main" = "$rejected_main" ]; then
              echo "main did not advance after the rejected publication" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$source_commit" "$main"; then
              echo "release source is not an ancestor of current main" >&2
              exit 1
            fi
            git reset --hard "$main"
            current="$(jq -r .version plugin/.claude-plugin/plugin.json)"
            comparison="$("$RELEASE_VERSION_COMPARE" "$version" "$current")"
            if [ "$comparison" -ge 0 ]; then
              cp "$RUNNER_TEMP/cci.binrun" plugin/bin/cci.binrun
              chmod +x plugin/bin/cci.binrun
              if [ "$version" != "$current" ]; then
                jq --arg v "$version" '.version = $v' plugin/.claude-plugin/plugin.json > "$RUNNER_TEMP/cci-main-plugin.json"
                mv "$RUNNER_TEMP/cci-main-plugin.json" plugin/.claude-plugin/plugin.json
              fi
              git add plugin/bin/cci.binrun plugin/.claude-plugin/plugin.json
            fi
            parents=(-p "$main")
            if git merge-base --is-ancestor "$descriptor_commit" "$main"; then
              if git diff --cached --quiet; then
                accepted_main="$main"
                break
              fi
            else
              parents+=(-p "$descriptor_commit")
            fi
            tree="$(git write-tree)"
            candidate="$(printf 'chore: sync cci.binrun + manifest to %s\n' "$GITHUB_REF_NAME" | git commit-tree "$tree" "${parents[@]}")"
            if git push origin "$candidate:refs/heads/main"; then
              git reset --hard "$candidate"
              accepted_main="$candidate"
              break
            fi
            rejected_main="$main"
          done
          if [ -z "$accepted_main" ]; then
            echo "failed to publish the descriptor after $attempt advancing-main attempts" >&2
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upload descriptor to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "$RUNNER_TEMP/cci.binrun" --repo "${GITHUB_REPOSITORY}" --clobber

  post-release-ci:
    needs: descriptor
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      commit: ${{ needs.descriptor.outputs.commit }}

  post-release-guides:
    needs: descriptor
    permissions:
      contents: write
    uses: yasyf/cc-guides/.github/workflows/guides.yml@dd3ec882c1589a0ced9ced85ff5469fc56209889
    with:
      commit: ${{ needs.descriptor.outputs.commit }}
      parallel_commits: true
    secrets: inherit
