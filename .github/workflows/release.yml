name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: yasyf/homebrew-tap/.github/workflows/release-go.yml@41f8de6765b3b833ef333b0b98f5683f0e46685b
    secrets: inherit

  descriptor:
    needs: release
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Download release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --dir dist --pattern '*.tar.gz' --pattern 'checksums.txt'
      - name: Render descriptor and sync manifest version
        run: |
          version="${GITHUB_REF_NAME#v}"
          plugin/scripts/render-descriptor.sh dist "$version" > plugin/bin/cci.binrun
          chmod +x plugin/bin/cci.binrun
          jq --arg v "$version" '.version = $v' plugin/.claude-plugin/plugin.json > plugin/.claude-plugin/plugin.json.tmp
          mv plugin/.claude-plugin/plugin.json.tmp plugin/.claude-plugin/plugin.json
      - name: Validate descriptor
        run: go run github.com/yasyf/binrun/cmd/binrun@v0.1.1 -- parse plugin/bin/cci.binrun
      - name: Move the tag onto the synced descriptor and land it on main
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/bin/cci.binrun plugin/.claude-plugin/plugin.json
          if git diff --cached --quiet; then
            echo "${GITHUB_REF_NAME} already carries its descriptor and manifest"
          else
            git commit -m "chore: sync cci.binrun + manifest to ${GITHUB_REF_NAME}"
            git tag -fa "${GITHUB_REF_NAME}" -m "${GITHUB_REF_NAME}"
            git push --force origin "refs/tags/${GITHUB_REF_NAME}"
          fi
          synced=$(git rev-parse HEAD)
          version="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout --quiet --detach origin/main
            landed=$(jq -r .version plugin/.claude-plugin/plugin.json)
            if [ "$(printf '%s\n%s\n' "$landed" "$version" | sort -V | tail -n 1)" = "$landed" ]; then
              echo "main already carries ${landed}, at or past ${GITHUB_REF_NAME}"
              git checkout --quiet "$synced"
              break
            fi
            git checkout "$synced" -- plugin/bin/cci.binrun plugin/.claude-plugin/plugin.json
            git commit -m "chore: sync cci.binrun + manifest to ${GITHUB_REF_NAME}"
            if git push origin HEAD:main; then
              break
            fi
            [ "$attempt" -lt 3 ] || exit 1
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upload descriptor to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" plugin/bin/cci.binrun --repo "${GITHUB_REPOSITORY}" --clobber

  post-release-ci:
    needs: descriptor
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      commit: ${{ needs.descriptor.outputs.commit }}

  post-release-guides:
    needs: descriptor
    permissions:
      contents: write
    uses: yasyf/cc-guides/.github/workflows/guides.yml@dd3ec882c1589a0ced9ced85ff5469fc56209889
    with:
      commit: ${{ needs.descriptor.outputs.commit }}
      parallel_commits: true
    secrets: inherit
