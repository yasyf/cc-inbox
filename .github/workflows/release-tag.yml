name: Release tag

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write

jobs:
  release:
    uses: yasyf/cc-skills/.github/workflows/plugin-release-tag.yml@64dfeead8756405a13ecb86fb51fd0b3bb5d83b4
    with:
      release-workflow: release.yml
      script-ref: 64dfeead8756405a13ecb86fb51fd0b3bb5d83b4
      paths: |
        client
        cmd
        github
        internal
        service
        trunk
        go.mod
        go.sum
        .goreleaser.yaml
        :(exclude,glob)**/*_test.go
        :(exclude,glob)**/testdata/**
